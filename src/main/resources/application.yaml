spring:
  application:
    name: taskflow

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskflow}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

info:
  app:
    name: TaskFlow
    description: Distributed Job Scheduling and Execution Platform
    version: 1.0.0
